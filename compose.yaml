name: friggy

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: friggy
      POSTGRES_USER: friggy
      POSTGRES_PASSWORD: friggy_local
    ports:
      - "5432:5432"
    volumes:
      - friggy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friggy -d friggy"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  friggy-postgres:
